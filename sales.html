<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

<body>
    
    <center>
    <div style="font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif; font-size: 50px;color: rgb(32, 231, 238);">Find Your Dream Place Today</div>
     </center>
     <video style="position: absolute;top: 0;left: 0;width: 100%;object-fit: cover;z-index: -1;"autoplay muted loop> 
        <source src="assets\vids\16019361_1920_1080_60fps.mp4" type="video/mp4">
     </video>
     
    <div style="display:flex;justify-content:center;">
     <fieldset style="height: 90px;position: relative;top: 30px;border-width: 5px;width: 1100px;">
        <legend style="color:rgb(35, 247, 11);"><b>FIND HERE</b></legend>
        <select name="location" style="height: 50px;">

            <option>price reduced properties</option>

        <select name="Property Type" style="position: relative;left: 200px;height: 50px; width: 140px;">
            <option>sort by </option>
            <option>ASC</option>
            <option>DESC</option>
        </select>
    <section style="position: absolute;left: 700px;top: 20px;">
    <label style="color: aliceblue;">Price: $</label>
    <input type="range"
           min="0"
           max="5000000"
           value="2500000"
           oninput="price.value=this.value">

    
        <output id="price" style="color: aliceblue;">2500000</output>
    </section>
    <button style="position: absolute;left: 1000px;top: 10px;height: 50px;width: 100px;color: rgb(19, 19, 18);background-color: greenyellow;">Search</button>

     </fieldset>
     </div>
